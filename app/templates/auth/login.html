{% extends "base.html" %}

{% block title %}Masuk - SI-PENAKERLA{% endblock %}

{% block content %}
<div class="auth-container d-flex justify-content-center align-items-center">
    <div class="auth-card card shadow-sm" style="width: 100%; max-width: 400px; border: none; border-radius: 12px; overflow: hidden;">
        <div class="auth-header">
            <i class="bi bi-person-circle fs-1 mb-2"></i>
            <h3 class="mb-1">Selamat Datang</h3>
            <p class="mb-0 small opacity-75">Masuk ke akun SI-PENAKERLA Anda</p>
        </div>
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="Masukkan email Anda">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Masukkan password Anda">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mb-3 py-2 fw-semibold">Masuk</button>
                
                <div class="text-center small">
                    Belum punya akun? <a href="{{ url_for('auth.register') }}" class="text-decoration-none">Daftar sekarang</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
